<script>

/* =========================================================
   BASIC ELEMENTS
========================================================= */

const chat = document.getElementById("chat");
const statusBox = document.getElementById("status");
const messageBox = document.getElementById("message");
const sendButton = document.getElementById("sendButton");

let currentAudio = null;
let currentAudioUrl = null;
let recognition = null;

let isStopped = false;
let isThinking = false;


/* =========================================================
   CONVERSATION MEMORY
========================================================= */

let conversation = [];


/* =========================================================
   CUSTOMER INFORMATION
========================================================= */

let customer = {

  softwareType: "",

  businessType: "",

  industry: "",

  features: [],

  employees: "",

  users: "",

  platform: "",

  location: "",

  currentSystem: "",

  requirement: "",

  budget: "",

  contact: "",

  stage: "software"

};


/* =========================================================
   GREETING
========================================================= */

const greeting =
"வணக்கம் சார்! KIKT Software Solutions-ல இருந்து பேசுறேன். உங்களுக்கு என்ன மாதிரி software தேவைப்படுது?";


/* =========================================================
   TEXT NORMALIZATION
========================================================= */

function normalizeText(text) {

  return text
    .toLowerCase()
    .replace(/[.,!?;:()]/g, " ")
    .replace(/\s+/g, " ")
    .trim();

}


/* =========================================================
   DISPLAY MESSAGE
========================================================= */

function addMessage(name, text) {

  chat.textContent +=
    "\n\n" + name + ": " + text;

  chat.scrollTop = chat.scrollHeight;

}


/* =========================================================
   AUDIO CLEANUP
========================================================= */

function cleanupAudio() {

  if (currentAudioUrl) {

    URL.revokeObjectURL(currentAudioUrl);

  }

  currentAudio = null;
  currentAudioUrl = null;

}


function stopCurrentAudio() {

  if (currentAudio) {

    currentAudio.pause();

    currentAudio.currentTime = 0;

  }

  cleanupAudio();

}


/* =========================================================
   BELLA VOICE
========================================================= */

async function speak(text) {

  stopCurrentAudio();

  isStopped = false;

  statusBox.textContent =
    "Bella voice generating...";

  try {

    const response = await fetch(
      "/api/tts",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          text: text
        })
      }
    );


    if (!response.ok) {

      let errorMessage =
        "Voice generation failed";

      try {

        const errorData =
          await response.json();

        if (errorData.error) {

          errorMessage =
            errorData.error;

        }

      } catch (e) {}

      throw new Error(errorMessage);

    }


    const audioBlob =
      await response.blob();


    if (isStopped) {
      return;
    }


    currentAudioUrl =
      URL.createObjectURL(audioBlob);


    currentAudio =
      new Audio(currentAudioUrl);


    currentAudio.onended = () => {

      cleanupAudio();

      if (!isStopped) {

        statusBox.textContent =
          "Bella voice finished. You can reply.";

      }

    };


    currentAudio.onerror = () => {

      cleanupAudio();

      statusBox.textContent =
        "Audio playback failed.";

    };


    await currentAudio.play();


    statusBox.textContent =
      "Bella is speaking...";


  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "Bella voice error: " +
      error.message;

  }

}


/* =========================================================
   RESET CUSTOMER
========================================================= */

function resetCustomer() {

  customer = {

    softwareType: "",

    businessType: "",

    industry: "",

    features: [],

    employees: "",

    users: "",

    platform: "",

    location: "",

    currentSystem: "",

    requirement: "",

    budget: "",

    contact: "",

    stage: "software"

  };

}


/* =========================================================
   START AI
========================================================= */

function startAI() {

  stopCurrentAudio();

  isStopped = false;

  resetCustomer();

  conversation = [];

  chat.textContent =
    "KIKT AI: " + greeting;


  conversation.push({

    role: "assistant",

    content: greeting

  });


  speak(greeting);

}


/* =========================================================
   YES / NO DETECTION
========================================================= */

function isYes(text) {

  const t = normalizeText(text);

  const yesWords = [

    "yes",
    "yes sir",
    "yeah",
    "yep",
    "sure",
    "okay",
    "ok",
    "correct",
    "right",
    "fine",
    "good",
    "ama",
    "aama",
    "aamanga",
    "venum",
    "venum sir",
    "வேண்டும்",
    "வேணும்",
    "ஆமா",
    "ஆமாம்",
    "சரி",
    "ஆம்",
    "ok sir",
    "okay sir"

  ];

  return yesWords.includes(t);

}


function isNo(text) {

  const t = normalizeText(text);

  const noWords = [

    "no",
    "no sir",
    "not needed",
    "not required",
    "vendam",
    "venam",
    "வேண்டாம்",
    "வேணாம்",
    "இல்லை",
    "illa",
    "illai"

  ];

  return noWords.includes(t);

}


/* =========================================================
   SOFTWARE TYPE DETECTION
========================================================= */

function detectSoftwareType(text) {

  const t = normalizeText(text);


  if (
    t.includes("billing") ||
    t.includes("bill software") ||
    t.includes("invoice") ||
    t.includes("invoicing") ||
    t.includes("pos") ||
    t.includes("point of sale") ||
    t.includes("பில்லிங்") ||
    t.includes("பில்")
  ) {

    return "billing";

  }


  if (
    t.includes("inventory") ||
    t.includes("stock management") ||
    t.includes("stock software") ||
    t.includes("ஸ்டாக்")
  ) {

    return "inventory";

  }


  if (
    t.includes("payroll") ||
    t.includes("salary software") ||
    t.includes("employee salary")
  ) {

    return "payroll";

  }


  if (
    t.includes("crm") ||
    t.includes("customer management")
  ) {

    return "crm";

  }


  if (
    t.includes("accounting") ||
    t.includes("accounts software") ||
    t.includes("accounts")
  ) {

    return "accounting";

  }


  if (
    t.includes("school management") ||
    t.includes("school software") ||
    t.includes("college software") ||
    t.includes("student management") ||
    t.includes("education software")
  ) {

    return "education";

  }


  if (
    t.includes("hospital software") ||
    t.includes("clinic software") ||
    t.includes("hospital management") ||
    t.includes("patient management")
  ) {

    return "healthcare";

  }


  if (
    t.includes("website") ||
    t.includes("web site") ||
    t.includes("web development")
  ) {

    return "website";

  }


  if (
    t.includes("mobile app") ||
    t.includes("mobile application") ||
    t.includes("android app") ||
    t.includes("ios app")
  ) {

    return "mobile_app";

  }


  if (
    t.includes("erp") ||
    t.includes("enterprise software")
  ) {

    return "erp";

  }


  if (
    t.includes("manufacturing software") ||
    t.includes("production software") ||
    t.includes("factory software")
  ) {

    return "manufacturing";

  }


  if (
    t.includes("hr software") ||
    t.includes("human resource")
  ) {

    return "hr";

  }


  return "";

}


/* =========================================================
   INDUSTRY DETECTION
========================================================= */

function detectIndustry(text) {

  const t = normalizeText(text);


  const industries = [

    {
      name: "retail",
      words: [

      ]
    },

    {
      name: "wholesale",
      words: [
        "wholesale",

      ]
    },

    {
      name: "textile",
      words: [
        "textile",
        "cloth",
        "garment",
        "fabric",
        "readymade"
      ]
    },

    {
      name: "restaurant",
      words: [
        "hotel",
        "restaurant",
        "bakery",
        "cafe",
        "food"
      ]
    },

    {
      name: "manufacturing",
      words: [
        "factory",
        "manufacturing",
        "production",
        "industry"
      ]
    },

    {
      name: "service",
      words: [
        "service",
        "service center",
        "repair",
        "maintenance"
      ]
    },

    {
      name: "education",
      words: [
        "school",
        "college",
        "institute",
        "academy"
      ]
    },

    {
      name: "healthcare",
      words: [
        "hospital",
        "clinic",
        "medical",
        "pharmacy"
      ]
    },

    {
      name: "salon",
      words: [
        "salon",
        "beauty parlour",
        "barber",
        "spa"
      ]
    },

    {
      name: "logistics",
      words: [
        "logistics",
        "transport",
        "courier",
        "delivery"
      ]
    }

  ];


  for (const industry of industries) {

    for (const word of industry.words) {

      if (t.includes(word)) {

        return industry.name;

      }

    }

  }


  return "";

}


/* =========================================================
   FEATURE DETECTION
========================================================= */

function detectFeatures(text) {

  const t = normalizeText(text);

  const features = [];


  const featureMap = [

    {
      name: "stock management",

        "stock",
        "inventory",
        "ஸ்டாக்"
      ]
    },

    {
      name: "GST",
      words: [
        "gst",
        "tax"
      ]
    },

    {
      name: "barcode",
      words: [
        "barcode",
        "bar code"
      ]
    },

    {
      name: "customer management",
      words: [
        "customer management",
        "customer details",
        "customer"
      ]
    },

    {
      name: "supplier management",
      words: [
        "supplier",
        "vendor"
      ]
    },

    {
      name: "purchase management",
      words: [

      ]
    },

      ]
    },

    {
      name: "multi-user access",
      words: [
        "multi user",
        "multiple users",
        "many users"
      ]
    }

  ];


  for (const item of featureMap) {

    for (const word of item.words) {

      if (t.includes(word)) {

        features.push(item.name);

        break;

      }

    }

  }


  return [...new Set(features)];

}


/* =========================================================
   NUMBER DETECTION
========================================================= */

function detectNumber(text) {

  const match =
    text.match(/\b\d+\b/);

  if (match) {

    return match[0];

  }

  return "";

}


/* =========================================================
   PLATFORM DETECTION
========================================================= */

function detectPlatform(text) {

  const t = normalizeText(text);


  if (
    t.includes("mobile") ||
    t.includes("phone") ||
    t.includes("android")
  ) {

    return "mobile";

  }


  if (
    t.includes("computer") ||
    t.includes("desktop") ||
    t.includes("laptop")
  ) {

    return "desktop";

  }


  if (
    t.includes("both") ||
    t.includes("rendum") ||
    t.includes("இரண்டும்")
  ) {

    return "both";

  }


  return "";

}


/* =========================================================
   PRICE DETECTION
========================================================= */

function isPriceQuestion(text) {

  const t = normalizeText(text);

  return (

    t.includes("price") ||
    t.includes("cost") ||
    t.includes("rate") ||
    t.includes("amount") ||
    t.includes("how much") ||
    t.includes("budget") ||
    t.includes("quotation") ||
    t.includes("quote") ||
    t.includes("விலை") ||
    t.includes("எவ்வளவு") ||
    t.includes("ரேட்")

  );

}


/* =========================================================
   UNKNOWN / NOT SURE
========================================================= */

function isUncertain(text) {

  const t = normalizeText(text);

  return (

    t.includes("dont know") ||
    t.includes("don't know") ||
    t.includes("not sure") ||
    t.includes("you suggest") ||
    t.includes("suggest") ||
    t.includes("anything") ||
    t.includes("whatever") ||
    t.includes(" தெரியல") ||
    t.includes("தெரியாது")

  );

}


/* =========================================================
   UPDATE CUSTOMER DATA
========================================================= */

function updateCustomer(text) {

  const software =
    detectSoftwareType(text);

  const industry =
    detectIndustry(text);

  const features =
    detectFeatures(text);

  const number =
    detectNumber(text);

  const platform =
    detectPlatform(text);


  if (software) {

    customer.softwareType =
      software;

  }


  if (industry) {

    customer.industry =
      industry;

    customer.businessType =
      industry;

  }


  if (features.length > 0) {

    customer.features = [
      ...new Set([
        ...customer.features,
        ...features
      ])
    ];

  }


  if (platform) {

    customer.platform =
      platform;

  }


  if (number) {

    if (
      customer.stage === "users"
    ) {

      customer.users =
        number;

    }

    else if (
      customer.stage === "employees"
    ) {

      customer.employees =
        number;

    }

  }


  if (
    text.length > 10
  ) {

    customer.requirement =
      text;

  }

}


/* =========================================================
   SOFTWARE NAME
========================================================= */

function softwareName(type) {

  const names = {

    billing: "billing software",

    inventory: "inventory management software",

    payroll: "payroll software",

    crm: "CRM software",

    accounting: "accounting software",

    education: "education management software",

    healthcare: "hospital / clinic management software",

    website: "website",

    mobile_app: "mobile application",

    erp: "ERP software",

    manufacturing: "manufacturing management software",

    hr: "HR management software"

  };


  return names[type] ||
    "custom software";

}


/* =========================================================
   MAIN SMART REPLY
========================================================= */

function getSmartReply(text) {

  const t =
    normalizeText(text);


  /* Update information first */

  updateCustomer(text);


  /* =========================================
     GREETING
  ========================================= */

  if (
    t === "hi" ||
    t === "hello" ||
    t === "hai" ||
    t === "hey" ||
    t.includes("vanakkam") ||
    t.includes("வணக்கம்")
  ) {

    customer.stage =
      "software";

    return "வணக்கம் சார் 😊 சொல்லுங்க. Unga business-ku enna software requirement irukku?";

  }


  /* =========================================
     PRICE QUESTION
  ========================================= */

  if (isPriceQuestion(text)) {

    customer.stage =
      "price";

    if (customer.softwareType) {

      return "Sure sir 👍 " +
        softwareName(customer.softwareType) +
        " price exact requirement and features-ku depend aagum. Unga requirement-a complete-ah understand pannitu KIKT team suitable quotation share pannalaam. Unga business type and required features sollunga sir.";

    }

    return "Sure sir 👍 Software price requirement-ku depend aagum. Unga business type and software-la enna functionality venum-nu konjam sollunga. Adha base panni suitable quotation discuss pannalaam.";

  }


  /* =========================================
     NOT SURE / SUGGEST
  ========================================= */

  if (isUncertain(text)) {

    if (!customer.softwareType) {

      return "Problem illa sir 😊 Naan guide panren. First unga business enna type sir? Shop, manufacturing, service, textile, education, healthcare, illa vera business-aa?";

    }


    return "No problem sir 👍 Unga requirement-ku suitable features-a naan suggest panren. First daily business-la ippo enna process manual-ah or existing software-la manage panreenga?";

  }


  /* =========================================
     SOFTWARE NOT YET KNOWN
  ========================================= */

  if (!customer.softwareType) {

    customer.stage =
      "software";

    return "Okay sir 👍 Purinjukitten. Unga business-ku enna software venum-nu sollunga — billing, inventory, payroll, accounting, CRM, website, mobile app, ERP, illa completely custom software-aa?";

  }


  /* =========================================
     INDUSTRY NOT KNOWN
  ========================================= */

  if (
    !customer.industry &&
    customer.softwareType !== "website" &&
    customer.softwareType !== "mobile_app"
  ) {

    customer.stage =
      "industry";

    return "Sure sir 👍 " +
      softwareName(customer.softwareType) +
      " setup pannalaam. Unga business / industry enna sir?";

  }


  /* =========================================
     YES ANSWER
  ========================================= */

  if (isYes(text)) {


    /* Billing / POS */

    if (
      customer.softwareType === "billing"
    ) {

      if (
        customer.features.length === 0
      ) {

        customer.features = [

          "stock management",
          "GST",
          "barcode",
          "reports"

        ];

        customer.stage =
          "users";

        return "Super sir 👍 Billing, stock management, GST, barcode and reports ellam requirement-la note panniten. Approximately evlo users software use panna poranga sir?";

      }


      customer.stage =
        "users";

      return "Okay sir 👍 Requirement note panniten. Approximately evlo users software use panna poranga?";

    }


    /* Generic software */

    customer.stage =
      "features";

    return "Sure sir 👍 Requirement note panniten. Software-la main-a enna features venum-nu sollunga. Unga current process-la enna problem irukku-nu sonnalum naan better-ah understand pannikkalaam.";

  }


  /* =========================================
     NO ANSWER
  ========================================= */

  if (isNo(text)) {

    if (
      customer.softwareType === "billing"
    ) {

      customer.stage =
        "features";

      return "Okay sir 👍 No problem. Billing basic requirement-a start pannalaam. GST, stock, reports, customer management-la edhu important sir?";

    }


    return "Okay sir 👍 No problem. Basic requirement-la start pannalaam. Unga main requirement enna sir?";

  }


  /* =========================================
     BILLING SOFTWARE
  ========================================= */

  if (
    customer.softwareType === "billing"
  ) {

    if (
      customer.features.length === 0
    ) {

      customer.stage =
        "features";

      return "Okay sir 👍 Billing software-ku GST, stock management, barcode, purchase, sales, customer management and reports madhiri features add pannalaam. Unga business-ku edhu important sir?";

    }


    if (
      customer.stage === "users"
    ) {

      const number =
        detectNumber(text);

      if (number) {

        customer.users =
          number;

        customer.stage =
          "platform";

        return "Okay sir 👍 Approximately " +
          number +
          " users-nu note panniten. Software computer-la use panna poringala, mobile-la use panna poringala, illa rendu platform-um venuma?";

      }

    }


    if (
      customer.stage === "platform"
    ) {

      if (customer.platform) {

        customer.stage =
          "currentSystem";

        return "Perfect sir 👍 Platform requirement-um note panniten. Ippo existing billing software use panreengala, illa currently manual-ah manage panreengala?";

      }

      return "Sir computer, mobile, illa both — edhula use panna poringa-nu sollunga.";

    }


    if (
      customer.stage === "currentSystem"
    ) {

      customer.currentSystem =
        text;

      customer.stage =
        "complete";

      return "Okay sir 👍 Unga requirement clear-ah note panniten. " +
        softwareName(customer.softwareType) +
        " with " +
        customer.features.join(", ") +
        " requirement. KIKT team unga business-ku suitable solution and quotation details share pannalaam. Contact details share pannunga sir.";

/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

  const text =
    messageBox.value.trim();


  if (!text) {

    statusBox.textContent =
      "Please type a message first.";

    return;

  }


  if (isThinking) {

    statusBox.textContent =
      "Please wait, Bella is preparing the reply...";

    return;

  }


  messageBox.value = "";


  addMessage(
    "Customer",
    text
  );


  conversation.push({

    role: "user",

    content: text

  });


  isThinking = true;

  sendButton.disabled = true;

  statusBox.textContent =
    "Understanding your requirement...";


  try {

    /*
      IMPORTANT:
      No OpenAI API here.
      This is local conversation logic.
    */

    const reply =
      getSmartReply(text);


    conversation.push({

      role: "assistant",

      content: reply

    });


    addMessage(
      "KIKT AI",
      reply
    );


    await speak(reply);


  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "Reply error: " +
      error.message;

  }


  isThinking = false;

  sendButton.disabled = false;

}


/* =========================================================
   ENTER KEY
========================================================= */

messageBox.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   MICROPHONE
========================================================= */

function startMic() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    statusBox.textContent =
      "Speech recognition not supported. Please type your message.";

    return;

  }


  if (isThinking) {

    statusBox.textContent =
      "Please wait for the current reply.";

    return;

  }


  try {

    recognition =
      new SpeechRecognition();


    recognition.lang =
      "ta-IN";


    recognition.continuous =
      false;


    recognition.interimResults =
      false;


    recognition.onstart = () => {

      statusBox.textContent =
        "Listening... Please speak.";

    };


    recognition.onresult =
      (event) => {

        const spokenText =
          event.results[0][0].transcript;


        messageBox.value =
          spokenText;


        statusBox.textContent =
          "Heard: " +
          spokenText;


        sendMessage();

      };


    recognition.onerror =
      (event) => {

        statusBox.textContent =
          "Mic error: " +
          event.error +
          ". You can type your message instead.";

      };


    recognition.onend = () => {

      recognition = null;

    };


    recognition.start();


  } catch (error) {

    statusBox.textContent =
      "Mic could not start. Please type your message.";

  }

}


/* =========================================================
   STOP VOICE
========================================================= */

function stopAI() {

  isStopped = true;


  if (recognition) {

    recognition.stop();

    recognition = null;

  }


  stopCurrentAudio();


  statusBox.textContent =
    "Voice stopped.";

}


/* =========================================================
   INITIAL STATE
========================================================= */

conversation = [

    role: "assistant",

    content: greeting

  }

];
