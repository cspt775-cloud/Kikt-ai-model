<body>

<div class="container">

    <h1>🤖 KIKT AI Voice Assistant</h1>

    <div class="subtitle">
        AI Sales & Software Support Assistant
    </div>

    <div id="status" class="status">
        Ready
    </div>

    <div id="chat" class="chat"></div>

    <div class="controls">
        <button class="start" onclick="startAI()">Start AI</button>
        <button class="speak" onclick="startListening()">🎤 Speak to AI</button>
        <button class="stop" onclick="stopSpeaking()">⛔ Stop Voice</button>
    </div>

    <div class="input-area">
        <input
            id="userInput"
            type="text"
            placeholder="Type your message..."
            onkeydown="handleEnter(event)"
        >

        <button class="send" onclick="sendMessage()">
            Send
        </button>
    </div>

    <div class="small">
        KIKT Software Solutions
    </div>

</div>


<script>

/* =========================================================
   CUSTOMER MEMORY / CONTEXT
========================================================= */

const customer = {

    modules: [],

    industry: "",

    features: [],

    users: "",

    employees: "",

    platform: "",

    currentSystem: "",

    existingSoftware: "",

    budget: "",

    contact: "",

    companyName: "",

    requirement: [],

    lastQuestion: "",

    conversationStarted: false,

    priceAsked: false

};


/* =========================================================
   CONVERSATION MEMORY
========================================================= */

let conversation = [];

let recognition = null;

let currentSpeech = null;


/* =========================================================
   BASIC HELPERS
========================================================= */

function addMessage(sender, text) {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");

    div.className =
        "message " + (sender === "AI" ? "ai" : "user");

    div.innerText = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}


function setStatus(text) {

    document.getElementById("status").innerText = text;

}


function addConversation(role, text) {

    conversation.push({
        role: role,
        text: text
    });

}


/* =========================================================
   ELEVENLABS TTS
========================================================= */

async function speak(text) {

    try {

        stopSpeaking();

        setStatus("AI speaking...");

        const response = await fetch("/api/tts", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                text: text
            })

        });

        if (!response.ok) {

            throw new Error("TTS failed");

        }

        const blob = await response.blob();

        const audioURL = URL.createObjectURL(blob);

        currentSpeech = new Audio(audioURL);

        currentSpeech.onended = function() {

            setStatus("Listening / Ready");

        };

        await currentSpeech.play();

    }

    catch (error) {

        console.error(error);

        setStatus("Voice unavailable");

    }

}


function stopSpeaking() {

    if (currentSpeech) {

        currentSpeech.pause();

        currentSpeech.currentTime = 0;

        currentSpeech = null;

    }

}


/* =========================================================
   START AI
========================================================= */

function startAI() {

    if (!customer.conversationStarted) {

        customer.conversationStarted = true;

        const greeting =
            "வணக்கம் sir! KIKT Software Solutions-ல இருந்து பேசுறேன். " +
            "உங்க business-க்கு என்ன மாதிரி software தேவைப்படுது? " +
            "Billing, inventory, payroll, CRM, accounting அல்லது வேறு software ஏதாவது தேவையா?";

        addMessage("AI", greeting);

        addConversation("assistant", greeting);

        customer.lastQuestion = "modules";

        speak(greeting);

    }

    else {

        const text =
            "Sure sir, நம்ம previous requirement-ல இருந்து continue பண்ணலாம். " +
            "என்ன information தெரிஞ்சிக்கணும்னு கேளுங்க.";

        addMessage("AI", text);

        addConversation("assistant", text);

        speak(text);

    }

}


/* =========================================================
   TEXT INPUT
========================================================= */

function handleEnter(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

}


function sendMessage() {

    const input = document.getElementById("userInput");

    const text = input.value.trim();

    if (!text) return;

    addMessage("USER", text);

    addConversation("user", text);

    input.value = "";

    processCustomerMessage(text);

}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

function startListening() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert("Speech recognition is not supported in this browser.");

        return;

    }

    recognition = new SpeechRecognition();

    recognition.lang = "ta-IN";

    recognition.continuous = false;

    recognition.interimResults = false;

    setStatus("Listening...");

    recognition.start();

    recognition.onresult = function(event) {

        const text =
            event.results[0][0].transcript;

        document.getElementById("userInput").value = text;

        processCustomerMessage(text);

    };

    recognition.onerror = function(error) {

        console.error(error);

        setStatus("Speech recognition error");

    };

}


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalize(text) {

    return text
        .toLowerCase()
        .replace(/[.,!?;:()]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

}


/* =========================================================
   UNIQUE ARRAY
========================================================= */

function addUnique(array, value) {

    if (!array.includes(value)) {

        array.push(value);

    }

}

/* =========================================================
   USER COUNT DETECTION
========================================================= */

function detectUsers(text) {

    const t = normalize(text);

    let match = t.match(
        /(\d+)\s*(users?|user|people|persons?|staff|employees?|members?|peru|பேர்|பேரு)/
    );

    if (match) {

        return match[1];

    }


    if (
        customer.lastQuestion === "users"
    ) {

        const onlyNumber =
            t.match(/^(\d+)$/);

        if (onlyNumber) {

            return onlyNumber[1];

        }

    }


    return "";

}

========================================================= */

    const t = normalize(text);


    if (
        t.includes("rendum") ||

        t.includes("mobile and computer") ||
        t.includes("computer and mobile") ||
        t.includes("desktop and mobile") ||
        t.includes("web and mobile")
    ) {

    if (
        t.includes("mobile only") ||
        t.includes("mobile la") ||
        t.includes("mobile") ||
        t.includes("android")
    ) {

    if (
        t.includes("computer only") ||
        t.includes("desktop") ||

/* =========================================================
   ACCEPT YES ANSWER
========================================================= */

function handleYes() {

    if (
        customer.lastQuestion === "features"
    ) {

        const suggestions =
            getSuggestedFeatures();

        suggestions.forEach(item => {

            addUnique(
                customer.features,
                item
            );

        });

        return true;

    }


    if (
        customer.lastQuestion === "platform"
    ) {

        return false;

    }


    if (
        customer.lastQuestion === "currentSystem"
    ) {

        return false;

    }


    return false;

}

/* =========================================================
   BUILD REQUIREMENT SUMMARY
========================================================= */

function buildSummary() {

    const parts = [];


    if (customer.companyName) {

    }

            customer.users
        );

    }


    if (customer.platform) {

        parts.push(
            "Platform: " +
            customer.platform
        );

    }


    if (customer.currentSystem) {

        parts.push(
            "Current system: " +
            customer.currentSystem
        );

    }


    return parts.join("\n");

}


/* =========================================================
   NEXT SALES STEP
========================================================= */

function getNextSalesStep() {


    /* SOFTWARE */

    if (
        customer.modules.length === 0
    ) {

        customer.lastQuestion = "modules";

        return (
            "Sure sir. Unga business-la ippo endha process-a software-la manage panna virumbureenga? " +
            "Billing, inventory, accounts, payroll, CRM, production அல்லது வேறு requirement?"
        );

    }


    /* INDUSTRY */

    if (
        !customer.industry &&
        customer.modules.some(m =>
            [
                "Billing",
                "Inventory",
                "Payroll",
                "Accounting",
                "CRM",
                "ERP"
            ].includes(m)
        )
    ) {

        customer.lastQuestion = "industry";

        return (
            "Okay sir 👍 " +
            customer.modules.join(" + ") +
            " requirement note panniten. " +
            "Unga business / industry enna sir?"
        );

    }


    /* FEATURES */

    if (
        customer.features.length === 0
    ) {

        const suggestions =
            getSuggestedFeatures();

        customer.lastQuestion = "features";


        if (suggestions.length > 0) {

            return (
                "Okay sir 👍 unga requirement-ku " +
                suggestions.slice(0, 7).join(", ") +
                " போன்ற features useful-ah இருக்கும். " +
                "இவைகளும் தேவைப்படுமா sir?"
            );

        }


        return (
            "Okay sir 👍 software requirement note panniten. " +
            "Ungalukku முக்கியமாக என்ன features தேவை sir?"
        );

    }


    /* USERS */

    if (
        !customer.users
    ) {

        customer.lastQuestion = "users";

        return (
            "Super sir 👍 required modules and features note panniten. " +
            "Approximately evlo users software use panna poranga sir?"
        );

    }


    /* PLATFORM */

    if (
        !customer.platform
    ) {

        customer.lastQuestion = "platform";

        return (
            "Okay sir 👍 " +
            customer.users +
            " users-nu note panniten. " +
            "Software computer-la use panna poringala, mobile-la use panna poringala, illa rendu platform-um venuma?"
        );

    }


    /* CURRENT SYSTEM */

    if (
        !customer.currentSystem
    ) {

        customer.lastQuestion = "currentSystem";

        return (
            "Perfect sir 👍 platform requirement-um note panniten. " +
            "Ippo indha process manual / Excel-la manage panreengala, " +
            "illa already existing software use panreengala?"
        );

    }


    /* EVERYTHING KNOWN */

    customer.lastQuestion = "complete";

    return (
        "Super sir 👍 unga basic requirement complete-ah understand panniten. " +
        "Quotation prepare panna scope clear-ah இருக்கு. " +
        "Unga requirement summary:\n\n" +
        buildSummary() +
        "\n\n" +
        "இதன் அடிப்படையில் KIKT team quotation / demo discussion continue pannalaam sir. " +
        "Contact number or WhatsApp number share pannunga."
    );

}


/* =========================================================
   PRICE RESPONSE
========================================================= */

function priceResponse() {

    customer.priceAsked = true;

    const summary = buildSummary();


    if (
        customer.modules.length === 0
    ) {

        customer.lastQuestion = "modules";

        return (
            "Sure sir 👍 software cost requirement and modules-க்கு depend aagum. " +
            "Billing, inventory, payroll, CRM, accounting போன்ற எந்த software தேவைன்னு first சொல்லுங்க. " +
            "அதுக்கேற்ப quotation scope identify pannalaam."
        );

    }


    return (
        "Sure sir 👍 software cost exact-ah சொல்லணும்னா required modules, " +
        "features, users and platform scope consider pannanum. " +
        "Ippo naan note pannirukkura requirement:\n\n" +
        summary +
        "\n\n" +
        "Indha scope confirm pannina KIKT team suitable quotation prepare panna mudiyum sir. " +
        "Exact price-ai guess pannaama requirement-based quotation dhaan share pannuvom."
    );

}


/* =========================================================
   MAIN CUSTOMER MESSAGE PROCESSOR
========================================================= */

function processCustomerMessage(originalText) {

    const text = originalText.trim();

    const t = normalize(text);


    /* ============================================
       1. DETECT DIRECT QUESTIONS FIRST
    ============================================ */

    const generalQuestion =
        detectQuestion(text);


    if (generalQuestion) {

        const answer =
            answerGeneralQuestion(generalQuestion);


        if (answer) {

            addMessage("AI", answer);

            addConversation(
                "assistant",
                answer
            );

            speak(answer);


            /*
             * IMPORTANT:
             * Answer customer question first.
             * Then continue sales process.
             */

            setTimeout(() => {

                const next =
                    getNextSalesStep();

                addMessage("AI", next);

                addConversation(
                    "assistant",
                    next
                );

                speak(next);

            }, 1200);


            return;

        }

    }


    /* ============================================
       2. PRICE QUESTION
    ============================================ */

    if (isPriceQuestion(text)) {

        /*
         * First extract information that exists
         * in same message.
         */

        updateCustomerMemory(text);


        const answer =
            priceResponse();


        addMessage("AI", answer);

        addConversation(
            "assistant",
            answer
        );

        speak(answer);

        return;

    }


    /* ============================================
       3. UPDATE ALL AVAILABLE CONTEXT
    ============================================ */

    updateCustomerMemory(text);


    /* ============================================
       4. YES ANSWER
    ============================================ */

    if (
        /^(yes|yes sir|yeah|ok|okay|sure|ama|aama|correct|right|venum|venum sir)$/i
            .test(t)
    ) {

        const accepted =
            handleYes();


        if (accepted) {

            const next =
                getNextSalesStep();


            addMessage("AI", next);

            addConversation(
                "assistant",
                next
            );

            speak(next);

            return;

        }

    }


    /* ============================================
       5. NOT SURE
    ============================================ */

    if (
        t.includes("not sure") ||
        t.includes("dont know") ||
        t.includes("don't know") ||
        t.includes("theriyala") ||
        t.includes("therila") ||
        t.includes("suggest") ||
        t.includes("you suggest")
    ) {

        const suggestions =
            getSuggestedFeatures();


        const answer =
            suggestions.length > 0

            ?

            (
                "No problem sir 👍 " +
                "Unga current requirement based on " +
                suggestions.slice(0, 7).join(", ") +
                " போன்ற features consider pannalaam. " +
                "Ithu business process-ku useful-ah இருக்கும். " +
                "Idhula தேவையானவற்றை include pannalaam."
            )

            :

            (
                "No problem sir 👍 unga business process based on suitable features suggest pannalaam. " +
                "First current process eppadi manage panreenga-nu sollunga."
            );


        addMessage("AI", answer);

        addConversation(
            "assistant",
            answer
        );

        speak(answer);


        setTimeout(() => {

            const next =
                getNextSalesStep();

            addMessage("AI", next);

            addConversation(
                "assistant",
                next
            );

            speak(next);

        }, 1200);


        return;

    }


    /* ============================================
       6. NORMAL SALES FLOW
    ============================================ */

    const reply =
        getNextSalesStep();


    addMessage("AI", reply);

    addConversation(
        "assistant",
        reply
    );

    speak(reply);

}


/* =========================================================
   UPDATE CUSTOMER MEMORY
========================================================= */

function updateCustomerMemory(text) {


    /* MODULES */

    const modules =
        detectModules(text);


    modules.forEach(module => {

        addUnique(
            customer.modules,
            module
        );

    });


    /* INDUSTRY */

    const industry =
        detectIndustry(text);


    if (industry) {

        customer.industry = industry;

    }


    /* FEATURES */

    const features =
        detectFeatures(text);


    features.forEach(feature => {

        addUnique(
            customer.features,
            feature
        );

    });


    /* USERS */

    const users =
        detectUsers(text);


    if (users) {

        customer.users = users;

    }


    /* PLATFORM */

    const platform =
        detectPlatform(text);


    if (platform) {

        customer.platform = platform;

    }


    /* CURRENT SYSTEM */

    const currentSystem =
        detectCurrentSystem(text);


    if (currentSystem) {

        customer.currentSystem =
            currentSystem;

    }


    /* CONTACT NUMBER */

    const phoneMatch =
        text.match(
            /(?:\+91[\s-]?)?[6-9]\d{9}/
        );


    if (phoneMatch) {

        customer.contact =
            phoneMatch[0];

    }


    /* EMAIL */

    const emailMatch =
        text.match(
            /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i
        );


    if (emailMatch) {

        customer.contact =
            emailMatch[0];

    }


    /* COMPANY NAME */

    if (
        normalize(text).includes("company name")
    ) {

        customer.companyName =
            text;

    }


    /* EMPLOYEE COUNT */

    const employeeMatch =
        normalize(text).match(
            /(\d+)\s*(employees?|staff|workers?)/
        );


    if (employeeMatch) {

        customer.employees =
            employeeMatch[1];

    }

}
