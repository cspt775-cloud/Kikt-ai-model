/* -----------------------------
   BASIC HELPERS
----------------------------- */

function normalize(text){

    return text
        .toLowerCase()
        .replace(/[.,!?;:()]/g," ")
        .replace(/\s+/g," ")
        .trim();
}


function addMessage(text,type){

    const row = document.createElement("div");
    row.className = "msg " + type;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.textContent = text;

    row.appendChild(bubble);
    messagesEl.appendChild(row);

    messagesEl.scrollTop = messagesEl.scrollHeight;
}


function aiSay(text){

    addMessage(text,"ai");

    speak(text);
}


function userSay(text){

    addMessage(text,"user");
}


/* =========================================================
   ELEVENLABS TTS
========================================================= */

async function speak(text){

    try{

        statusEl.textContent = "AI speaking...";

        const response = await fetch("/api/tts",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                text:text
            })

        });

        if(!response.ok){

            statusEl.textContent = "";
            return;
        }

        const blob = await response.blob();

        const url = URL.createObjectURL(blob);

        const audio = new Audio(url);

        audio.onended = () => {

            URL.revokeObjectURL(url);
            statusEl.textContent = "";

        };

        await audio.play();

    }
    catch(error){

        console.error(error);
        statusEl.textContent = "";

    }
}

    if(!value) return;

/* =========================================================

function detectUsers(text){

    let match = text.match(
        /(\d+)\s*(users?|user|staff|employees?|people|members?|persons?)/i
    );

    if(match){

        state.users = match[1];
        return true;
    }

    if(
        state.lastQuestionType === "users" &&
        /^\d+$/.test(text.trim())
    ){

        state.users = text.trim();
        return true;
    }

    return false;
}

/* =========================================================
   CONTACT
========================================================= */

function detectContact(text){

    const phone = text.match(
        /(?:\+91[\s-]?)?[6-9]\d{9}/
    );

    if(phone){

        state.contact = phone[0];
        return true;
    }

    const email = text.match(
        /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i
    );

    if(email){

        state.email = email[0];
        return true;
    }

    return false;
}

========================================================= */

function detectCompany(text){

    const match = text.match(
        /(?:company name is|company is|our company is|business name is)\s+(.+)/i
    );

    if(match){

        state.companyName = match[1].trim();
        return true;
    }

    return false;
}

/* =========================================================

========================================================= */

function requirementSummary(){

    let parts = [];

    if(state.industry)
        parts.push("Industry: " + state.industry);

    if(state.requirements.length)
        parts.push(
            "Requirements: " +
            state.requirements.join(", ")
        );

    if(state.problems.length)
        parts.push(
            "Problems: " +
            state.problems.join(", ")
        );

    if(state.users)
        parts.push(
            "Users: " + state.users
        );

    if(state.platform)
        parts.push(
            "Platform: " + state.platform
        );

    if(state.currentSystem)
        parts.push(
            "Current system: " +
            state.currentSystem
        );

    if(state.companyName)
        parts.push(
            "Company: " +
            state.companyName
        );

    return parts.join("\n");
}

   DETERMINE WHETHER ENOUGH INFORMATION EXISTS
========================================================= */

function enoughForLead(){

    return (
        state.industry &&
        state.requirements.length > 0 &&
        (
            state.contact ||
            (
                state.users &&
                state.platform
            )
        )
    );
}


/* =========================================================
   NEXT QUESTION
========================================================= */

function getNextStep(){

    /*
       IMPORTANT:
       Never ask something already known.
    */


    if(!state.industry){

        state.lastQuestionType = "industry";
        state.lastQuestion =
            "industry";

        return "Sure sir 👍 unga business endha industry / field-la irukku?";
    }


    if(state.requirements.length === 0){

        state.lastQuestionType = "requirements";
        state.lastQuestion =
            "requirements";

        return "Okay sir 👍 unga business-ku mainly enna process / work software-la manage panna venum?";
    }


    /*
       Ask users only if missing.
    */

    if(!state.users){

        state.lastQuestionType = "users";
        state.lastQuestion =
            "users";

        return "Okay sir 👍 approximately evlo users software use panna poranga?";
    }


    /*
       Platform
    */

    if(!state.platform){

        state.lastQuestionType = "platform";
        state.lastQuestion =
            "platform";

        return "Software mobile-la use panna poringala, computer/web-la use panna poringala, illa rendu platform-um venuma sir?";
    }


    /*
       Current system
    */

    if(!state.currentSystem){

        state.lastQuestionType = "currentSystem";
        state.lastQuestion =
            "currentSystem";

        return "Ippo indha process manual / Excel-la manage panreengala, illa already existing software use panreengala sir?";
    }


    /*
       If no contact, collect it
    */

    if(!state.contact && !state.email){

        state.lastQuestionType = "contact";
        state.lastQuestion =
            "contact";

        return "Perfect sir 👍 requirement clear-ah understand panniten. Quotation / demo discussion-ku unga contact number share pannunga.";
    }


    return "";
}


/* =========================================================
   PRICE RESPONSE
========================================================= */

function priceResponse(){

    state.priceAsked = true;

    let response =
        "Sir, software cost exact-ah சொல்லணும்னா requirement based on quotation prepare பண்ணணும். " +
        "Modules, number of users, platform and customization based on cost change aagum.";

    if(state.requirements.length){

        response +=
            "\n\nIppo neenga sonna requirement: " +
            state.requirements.join(", ") + ".";
    }

    if(state.users){

        response +=
            " Users: " + state.users + ".";
    }

    if(state.platform){

        response +=
            " Platform: " + state.platform + ".";
    }

    response +=
        "\n\nUnga contact number share pannina KIKT team requirement check panni quotation/demo discussion continue pannuvanga sir.";

    state.lastQuestionType = "contact";

    return response;
}


/* =========================================================
   CLOSE LEAD
========================================================= */

function closeLead(){

    state.leadClosed = true;

    let response =
        "Thank you sir 👍 unga contact number note panniten.";

    if(state.industry)
        response +=
            "\nIndustry: " + state.industry;

    if(state.requirements.length)
        response +=
            "\nRequirements: " +
            state.requirements.join(", ");

    if(state.users)
        response +=
            "\nUsers: " + state.users;

    if(state.platform)
        response +=
            "\nPlatform: " + state.platform;

    if(state.currentSystem)
        response +=
            "\nCurrent system: " +
            state.currentSystem;

    response +=
        "\n\nKIKT team unga requirement based on quotation / demo discussion-ku contact pannuvanga sir. 👍";

    return response;
}


/* =========================================================
   OPTIONAL REQUIREMENT SUGGESTION
========================================================= */

function suggestMoreRequirements(){

    const suggestions = industrySuggestions();

    const missing = suggestions.filter(
        item => !state.requirements.includes(item)
    );

    if(!missing.length){

        return "Sir, basic requirements already capture panniten. Vera specific process irundha sollunga, adhayum requirement-la add pannalaam.";
    }

    return (
        "Sir 👍 unga " +
        state.industry +
        " business-ku usually " +
        missing.slice(0,6).join(", ") +
        " madhiri modules useful-ah irukkum. " +
        "Idhula ungalukku edhu venumo sollunga, add panniduren."
    );
}


/* =========================================================
   MAIN MESSAGE PROCESSOR
========================================================= */

async function processMessage(rawText){

    const text = normalize(rawText);

    if(!text) return;

    state.lastUserMessage = rawText;

    /*
       FIRST:
       Extract information.
    */

    detectIndustry(text);
    detectRequirements(text);
    detectProblems(text);
    detectUsers(text);
    detectPlatform(text);
    detectCurrentSystem(text);
    detectContact(text);
    detectCompany(text);


    /* ---------------------------------------------
       CONTACT RECEIVED
    --------------------------------------------- */

    if(
        (state.contact || state.email) &&
        !state.leadClosed &&
        state.requirements.length > 0
    ){

        aiSay(closeLead());
        return;
    }


    /* ---------------------------------------------
       PRICE QUESTION
    --------------------------------------------- */

    if(isPriceQuestion(text)){

        aiSay(priceResponse());

        return;
    }


    /* ---------------------------------------------
       GENERAL QUESTION
    --------------------------------------------- */

    if(isQuestion(text)){

        const answer =
            answerGeneralQuestion(text);

        if(answer){

            aiSay(answer);

            /*
               After answering,
               continue only if useful.
            */

            if(!state.leadClosed){

                const next =
                    getNextStep();

                if(next){

                    setTimeout(()=>{
                        aiSay(next);
                    },700);
                }
            }

            return;
        }
    }


    /* ---------------------------------------------
       "YES / OK / SURE"
       Based on previous question
    --------------------------------------------- */

    if(
        has(text,[
            "yes",
            "yes sir",
            "ok",
            "okay",
            "sure",
            "correct",
            "venum",
            "venum sir"
        ])
    ){

        if(state.lastQuestionType === "suggestion"){

            aiSay(
                "Sure sir 👍 andha requirement-um note panniten."
            );

            state.lastQuestionType = "";

            const next = getNextStep();

            if(next){

                setTimeout(()=>{
                    aiSay(next);
                },600);
            }

            return;
        }
    }


    /* ---------------------------------------------
       "NOT SURE / SUGGEST"
    --------------------------------------------- */

    if(
        has(text,[
            "not sure",
            "you suggest",
            "suggest pannunga",
            "suggest",
            "what do you recommend",
            "enna venum nu theriyala"
        ])
    ){

        state.lastQuestionType = "suggestion";

        aiSay(
            suggestMoreRequirements()
        );

        return;
    }


    /* ---------------------------------------------
       IF CUSTOMER GAVE REQUIREMENTS
    --------------------------------------------- */

    if(state.requirements.length > 0){

        /*
           Industry-specific acknowledgement
        */

        let response = "";

        if(state.industry){

            response +=
                "ஆம் sir 👍 " +
                state.industry +
                " business requirement-nu note panniten. ";
        }
        else{

            response +=
                "ஆம் sir 👍 requirement note panniten. ";
        }


        response +=
            "Neenga sonna " +
            state.requirements.join(", ") +
            " software-la manage panna mudiyum.";


        /*
           Problems
        */

        if(state.problems.length){

            response +=
                " " +
                state.problems.join(", ") +
                " problem-um software workflow-la handle panna mudiyum.";
        }


        /*
           Don't ask generic software question.
           Ask only next missing data.
        */

        const next =
            getNextStep();


        if(next){

            response +=
                "\n\n" + next;
        }


        aiSay(response);

        return;
    }


    /* ---------------------------------------------
       NO REQUIREMENT YET
    --------------------------------------------- */

    const next =
        getNextStep();

    aiSay(next);
}


/* =========================================================
   SEND
========================================================= */

async function sendMessage(){

    const text = inputEl.value.trim();

    if(!text) return;

    userSay(text);

    inputEl.value = "";

    sendBtn.disabled = true;

    try{

        await processMessage(text);

    }
    catch(error){

        console.error(error);

        aiSay(
            "Sorry sir, konjam technical issue. Requirement-a once more simple-ah sollunga."
        );
    }

    sendBtn.disabled = false;

    inputEl.focus();
}


sendBtn.addEventListener(
    "click",
    sendMessage
);


inputEl.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            sendMessage();
        }
    }
);


/* =========================================================
   GREETING
========================================================= */

function startConversation(){

    if(state.started) return;

    state.started = true;

    aiSay(
        "வணக்கம் sir! KIKT Software Solutions-ல இருந்து பேசுறேன். " +
        "உங்க business எந்த field-la இருந்தாலும், உங்க process மற்றும் problem-ஐ சொல்லுங்க. " +
        "அதை based on software solution எப்படி customize பண்ணலாம் என்று நான் guide பண்றேன்."
    );
}


startConversation();

</script>
