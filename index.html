/* =========================================================
   NORMALIZE
========================================================= */

function normalize(text){

    return text
        .toLowerCase()
        .replace(/[.,!?;:()[\]{}]/g," ")
        .replace(/\s+/g," ")
        .trim();

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(text,type){

    const row =
        document.createElement("div");

    row.className =
        "msg " + type;

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;

    row.appendChild(bubble);

    messagesEl.appendChild(row);

    messagesEl.scrollTop =
        messagesEl.scrollHeight;
}


/* =========================================================
   AI MESSAGE
========================================================= */

function aiSay(text){

    addMessage(text,"ai");

    if(state.speakEnabled){

        speak(text);

    }

}


/* =========================================================
   USER MESSAGE
========================================================= */

function userSay(text){

    addMessage(text,"user");

}


/* =========================================================
   SPEAK
========================================================= */

async function speak(text){

    if(!state.speakEnabled)
        return;

    try{

        stopAudio();

        statusEl.textContent =
            "AI Speaking...";

        const response =
            await fetch("/api/tts",{

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({
                    text:text
                })

            });


        if(!response.ok){

            statusEl.textContent =
                "Speech unavailable";

            return;
        }


        const blob =
            await response.blob();

        const url =
            URL.createObjectURL(blob);

        currentAudio =
            new Audio(url);


        currentAudio.onended =
            function(){

                URL.revokeObjectURL(url);

                currentAudio =
                    null;

                statusEl.textContent =
                    "AI Ready";

            };


        await currentAudio.play();

    }
    catch(error){

        console.error(error);

        statusEl.textContent =
            "AI Ready";

    }

}


/* =========================================================
   STOP AUDIO
========================================================= */

function stopAudio(){

    if(currentAudio){

        currentAudio.pause();

        currentAudio.currentTime = 0;

        currentAudio = null;

    }

    statusEl.textContent =
        "AI Ready";

}


/* =========================================================
   ARRAY HELPER
========================================================= */

function addUnique(array,value){

    if(!value)
        return;

    if(!array.includes(value)){

        array.push(value);

    }

}

========================================================= */

    return words.some(

    );

function detectUsers(text){

    const match =
        text.match(
            /(\d+)\s*(users?|user|staff|employees?|people|members?)/i
        );


    if(match){

        state.users =
            match[1];

        return true;
    }


    if(
        state.lastQuestionType === "users" &&
        /^\d+$/.test(text)
    ){

        state.users =
            text;

        return true;
    }


    return false;
}

        return true;

    const email =

        );

            email[0];

        return true;
    }


    return false;
}

            "Billing & Invoicing",
            "Customer Management"
        ],

        "Education":[
            "Student Management",
            "Attendance Management",
            "Fees Management",
            "Exam Management",
            "Staff Management",
            "Reports"
        ],

        "Healthcare":[
            "Patient Management",
            "Appointment Management",
            "Billing & Invoicing",
            "Pharmacy Management",
            "Doctor Management",
            "Reports"
        ],

        "Salon":[
            "Customer Management",
            "Appointment Management",
            "Staff Management",
            "Billing & Invoicing",
            "Inventory Management",
            "Payment Tracking"
        ],

        "Real Estate":[
            "Property Management",

        ],

    return map[state.industry] || [

    ];

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function getNextQuestion(){

    /*
       INDUSTRY MISSING
    */

    if(!state.industry){

        state.lastQuestionType =
            "industry";

        return "Sure sir 👍 unga business endha industry / field-la irukku?";
    }


    /*
       REQUIREMENT MISSING

       Instead of asking:
       "What software do you need?"

       Ask industry-specific question.
    */

    if(state.requirements.length === 0){

        state.lastQuestionType =
            "requirements";

        const suggestions =
            getIndustrySuggestions();

        return (
            "Okay sir 👍 " +
            state.industry +
            " business-ku " +
            suggestions.slice(0,4).join(", ") +
            " madhiri processes software-la manage panna mudiyum. " +
            "Ungalukku mainly edhu venum sir?"
        );
    }


    /*
       USERS
    */

    if(!state.users){

        state.lastQuestionType =
            "users";

        return "Okay sir 👍 approximately evlo users software use panna poranga?";
    }


    /*
       PLATFORM
    */

    if(!state.platform){

        state.lastQuestionType =
            "platform";

        return "Software mobile-la use panna poringala, computer/web-la use panna poringala, illa rendu platform-um venuma sir?";
    }


    /*
       CURRENT SYSTEM
    */

    if(!state.currentSystem){

        state.lastQuestionType =
            "currentSystem";

        return "Ippo indha process manual / Excel-la manage panreengala, illa already existing software use panreengala sir?";
    }


    /*
       CONTACT
    */

    if(!state.contact && !state.email){

        state.lastQuestionType =
            "contact";

        return "Perfect sir 👍 requirement clear-ah understand panniten. Quotation / demo discussion-ku unga contact number share pannunga.";
    }


    return "";
}


/* =========================================================
   PRICE
========================================================= */

function priceAnswer(){

    state.priceAsked = true;

    let response =
        "Sir, software cost exact-ah requirement based on quotation prepare pannitu sollanum. Modules, users, platform and customization based on cost vary aagum.";

    if(state.requirements.length){

        response +=
            "\n\nIppo note pannirukkura requirements: " +
            state.requirements.join(", ") + ".";
    }

    if(state.users){

        response +=
            "\nUsers: " + state.users + ".";
    }

    if(state.platform){

        response +=
            "\nPlatform: " + state.platform + ".";
    }

    response +=
        "\n\nContact number share pannina KIKT team quotation/demo discussion continue pannuvanga sir.";

    state.lastQuestionType =
        "contact";

    return response;
}


/* =========================================================
   CLOSE LEAD
========================================================= */

function closeLead(){

    state.leadClosed =
        true;

    let response =
        "Thank you sir 👍 contact number note panniten.";

    if(state.industry){

        response +=
            "\nIndustry: " +
            state.industry;
    }

    if(state.requirements.length){

        response +=
            "\nRequirements: " +
            state.requirements.join(", ");
    }

    if(state.users){

        response +=
            "\nUsers: " +
            state.users;
    }

    if(state.platform){

        response +=
            "\nPlatform: " +
            state.platform;
    }

    if(state.currentSystem){

        response +=
            "\nCurrent system: " +
            state.currentSystem;
    }

    response +=
        "\n\nKIKT team unga requirement based on quotation / demo discussion-ku contact pannuvanga sir. 👍";

    return response;
}


/* =========================================================
   MAIN PROCESS
========================================================= */

async function processMessage(raw){

    const text =
        normalize(raw);


    if(!text)
        return;


    /*
       EXTRACT EVERYTHING FIRST
    */

    detectIndustry(text);

    detectRequirements(text);

    detectProblems(text);

    detectUsers(text);

    detectPlatform(text);

    detectCurrentSystem(text);

    detectContact(text);


    /*
       PHONE NUMBER
    */

    if(
        state.contact &&
        state.requirements.length > 0 &&
        !state.leadClosed
    ){

        aiSay(
            closeLead()
        );

        return;
    }


    /*
       PRICE
    */

    if(isPriceQuestion(text)){

        aiSay(
            priceAnswer()
        );

        return;
    }


    /*
       GENERAL QUESTION
    */

    const questionAnswer =
        answerQuestion(text);


    if(questionAnswer){

        aiSay(
            questionAnswer
        );


        /*
           After answering,
           ask only if some required information
           is still missing.
        */

        if(!state.leadClosed){

            const next =
                getNextQuestion();

            if(next){

                setTimeout(
                    ()=>{
                        aiSay(next);
                    },
                    600
                );

            }

        }

        return;
    }


    /*
       SALON EXAMPLE:
       "enaku saloon related software venu"

       Industry = Salon

       Requirements = none

       Therefore ask:
       appointment/customer/staff/billing...
       NOT industry again.
    */

    if(
        state.industry &&
        state.requirements.length === 0
    ){

        const next =
            getNextQuestion();

        aiSay(next);

        return;
    }


    /*
       REQUIREMENTS FOUND
    */

    if(state.requirements.length > 0){

        let response = "";


        response +=
            "Yes sir 👍 ";


        if(state.industry){

            response +=
                state.industry +
                " business requirement-nu note panniten. ";
        }


        response +=
            "Neenga sonna " +
            state.requirements.join(", ") +
            " software-la manage panna mudiyum.";


        if(state.problems.length){

            response +=
                "\n" +
                state.problems.join(", ") +
                " problem-um handle panna mudiyum.";
        }


        const next =
            getNextQuestion();


        if(next){

            response +=
                "\n\n" +
                next;
        }


        aiSay(response);

        return;
    }


    /*
       DEFAULT
    */

    aiSay(
        getNextQuestion()
    );

}


/* =========================================================
   SEND
========================================================= */

async function sendMessage(){

    const text =
        inputEl.value.trim();


    if(!text)
        return;


    userSay(text);

    inputEl.value = "";

    sendBtn.disabled = true;

    typingEl.textContent =
        "AI is thinking...";


    try{

        await processMessage(text);

    }
    catch(error){

        console.error(error);

        aiSay(
            "Sorry sir, konjam technical issue. Requirement-a once more simple-ah sollunga."
        );

    }


    typingEl.textContent = "";

    sendBtn.disabled = false;

    inputEl.focus();

}


/* =========================================================
   BUTTONS
========================================================= */


/* START AI */

startBtn.addEventListener(
    "click",
    function(){

        if(state.started){

            statusEl.textContent =
                "AI already started";

            return;
        }


        state.started = true;

        const greeting =
            "வணக்கம் sir! KIKT Software Solutions-ல இருந்து பேசுறேன். உங்க business எந்த field-la இருந்தாலும், உங்க process அல்லது problem-ஐ சொல்லுங்க. அதை based on software solution எப்படி customize பண்ணலாம் என்று நான் guide பண்றேன்.";

        aiSay(greeting);

    }
);


/* STOP AI */

stopBtn.addEventListener(
    "click",
    function(){

        stopAudio();

        statusEl.textContent =
            "AI Stopped";

    }
);


/* SPEAK ON / OFF */

speakBtn.addEventListener(
    "click",
    function(){

        state.speakEnabled =
            !state.speakEnabled;


        if(state.speakEnabled){

            speakBtn.textContent =
                "🔊 Speak AI: ON";

            speakBtn.classList.add(
                "active"
            );

            statusEl.textContent =
                "Voice enabled";

        }
        else{

            stopAudio();

            speakBtn.textContent =
                "🔇 Speak AI: OFF";

            speakBtn.classList.remove(
                "active"
            );

            statusEl.textContent =
                "Voice disabled";

        }

    }
);


/* SEND */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* ENTER */

inputEl.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            sendMessage();

        }

    }
);


/* =========================================================
   AUTO START
========================================================= */

/*
   Do NOT automatically speak greeting.
   User can click Start AI.
*/

statusEl.textContent =
    "AI Ready";

</script>
