<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KIKT AI Sales & Support Assistant</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f6fa;
  color: #18212b;
}

.topbar {
  background: #111827;
  color: white;
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  font-size: 19px;
  font-weight: 700;
}

.sub {
  font-size: 12px;
  opacity: .7;
  margin-top: 4px;
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #ef4444;
}

.dot.on {
  background: #22c55e;
}

.wrap {
  max-width: 980px;
  margin: 25px auto;
  padding: 0 15px;
}

.panel {
  background: white;
  border-radius: 16px;
  box-shadow: 0 8px 30px rgba(15,23,42,.08);
  overflow: hidden;
}

.controls {
  padding: 14px;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 10px 14px;
  cursor: pointer;
  font-weight: 600;
  background: #e5e7eb;
  color: #111827;
}

button.primary {
  background: #111827;
  color: white;
}

button.active {
  background: #16a34a;
  color: white;
}

button.danger {
  background: #dc2626;
  color: white;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

#messages {
  height: 480px;
  overflow-y: auto;
  padding: 20px;
  background: #f8fafc;
}

.msg {
  display: flex;
  margin: 10px 0;
}

.msg.ai {
  justify-content: flex-start;
}

.msg.user {
  justify-content: flex-end;
}

.bubble {
  max-width: 78%;
  padding: 12px 15px;
  border-radius: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}

.ai .bubble {
  background: white;
  border: 1px solid #e5e7eb;
}

.user .bubble {
  background: #111827;
  color: white;
}

.typing {
  font-size: 13px;
  color: #64748b;
  padding: 0 20px 10px;
  display: none;
}

.composer {
  display: flex;
  gap: 9px;
  padding: 15px;
  border-top: 1px solid #e5e7eb;
}

#textInput {
  flex: 1;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  padding: 12px;
  font-size: 15px;
  outline: none;
}

#textInput:focus {
  border-color: #64748b;
}

.mic {
  min-width: 52px;
  font-size: 18px;
}

.note {
  font-size: 12px;
  color: #64748b;
  padding: 0 15px 15px;
}

.memory {
  margin-top: 12px;
  background: white;
  border-radius: 12px;
  padding: 12px 15px;
  font-size: 12px;
  color: #475569;
  display: none;
}

</style>
</head>

<body>

<header class="topbar">

  <div>
    <div class="brand">
      KIKT Software Solutions
    </div>

    <div class="sub">
      AI Sales & Support Assistant
    </div>
  </div>

  <div class="status">

    <span id="statusDot" class="dot"></span>

    <span id="statusText">
      AI Stopped
    </span>

  </div>

</header>


<main class="wrap">

<section class="panel">

<div class="controls">

<button id="startBtn" class="primary">
Start AI
</button>

<button id="stopBtn" class="danger" disabled>
Stop AI
</button>

<button id="speakBtn">
Speak AI: ON
</button>

<button id="micBtn">
Mic: OFF
</button>

<button id="clearBtn">
Clear Chat
</button>

</div>


<div id="messages"></div>


<div id="typing" class="typing">
AI is thinking...
</div>


<div class="composer">

<input
  id="textInput"
  type="text"
  placeholder="Type your message..."
  autocomplete="off"
/>

<button
  id="micSendBtn"
  class="mic"
>
🎙️
</button>

<button
  id="sendBtn"
  class="primary"
>
Send
</button>

</div>


<div class="note">

Voice input uses browser speech recognition.
Gemini understands the transcript and conversation context.

</div>

</section>


<div id="memoryBox" class="memory"></div>

</main>


<script>

const state = {

  running: false,

  speaking: true,

  mic: false,

  history: [],

  memory: {

    industry: "",

    requirements: [],

    problems: [],

    users: "",

    platform: "",

    currentSystem: "",

    contact: "",

    email: "",

    leadClosed: false

  },

  recognition: null,

  listening: false

};


const messages =
  document.getElementById("messages");

const input =
  document.getElementById("textInput");

const sendBtn =
  document.getElementById("sendBtn");

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const speakBtn =
  document.getElementById("speakBtn");

const micBtn =
  document.getElementById("micBtn");

const micSendBtn =
  document.getElementById("micSendBtn");

const clearBtn =
  document.getElementById("clearBtn");

const typing =
  document.getElementById("typing");

const statusDot =
  document.getElementById("statusDot");

const statusText =
  document.getElementById("statusText");

const memoryBox =
  document.getElementById("memoryBox");


function addMessage(role, text) {

  const row =
    document.createElement("div");

  row.className =
    "msg " +
    (role === "assistant" ? "ai" : "user");

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  row.appendChild(bubble);

  messages.appendChild(row);

  messages.scrollTop =
    messages.scrollHeight;
}


function addHistory(role, text) {

  state.history.push({
    role,
    text
  });

  if (state.history.length > 30) {

    state.history =
      state.history.slice(-30);

  }

}


function updateStatus() {

  statusDot.classList.toggle(
    "on",
    state.running
  );

  statusText.textContent =
    state.running
      ? "AI Running"
      : "AI Stopped";

  startBtn.disabled =
    state.running;

  stopBtn.disabled =
    !state.running;

}


function updateMemoryBox() {

  const m = state.memory;

  const requirements =
    Array.isArray(m.requirements)
      ? m.requirements.join(", ")
      : "";

  let text = "";

  if (m.industry) {
    text +=
      "Industry: " +
      m.industry +
      " | ";
  }

  if (requirements) {
    text +=
      "Requirements: " +
      requirements;
  }

  memoryBox.textContent =
    text;

  memoryBox.style.display =
    text ? "block" : "none";

}


function speakText(text) {

  if (!state.speaking || !text)
    return;

  fetch("/api/tts", {

    method: "POST",

    headers: {
      "Content-Type":
        "application/json"
    },

    body: JSON.stringify({
      text: text
    })

  })

  .then(async response => {

    if (!response.ok)
      throw new Error(
        "TTS failed"
      );

    const blob =
      await response.blob();

    const url =
      URL.createObjectURL(blob);

    const audio =
      new Audio(url);

    audio.onended = () => {
      URL.revokeObjectURL(url);
    };

    audio.play().catch(() => {});

  })

  .catch(error => {

    console.error(
      "ElevenLabs TTS:",
      error
    );

  });

}


async function sendMessage(rawText) {

  const text = String(rawText || "").trim();

  if (!text || !state.running)
    return;

  addMessage("user", text);
  addHistory("user", text);
  input.value = "";

  typing.style.display = "block";
  sendBtn.disabled = true;
  micSendBtn.disabled = true;

  try {

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text,
        history: state.history,
        memory: state.memory
      })
    });

    // Read as text first so even a Vercel/HTML/plain-text error is visible.
    const rawResponse = await response.text();

    let data = {};

    try {
      data = rawResponse ? JSON.parse(rawResponse) : {};
    } catch (parseError) {
      throw new Error(
        "Server returned non-JSON response (HTTP " +
        response.status + "): " +
        rawResponse.slice(0, 500)
      );
    }

    if (!response.ok) {

      const details = data.details
        ? JSON.stringify(data.details)
        : "";

      throw new Error(
        (data.error || "AI request failed") +
        " | HTTP " +
        response.status +
        (details ? " | " + details : "")
      );
    }

    if (data.memory) {
      state.memory = {
        ...state.memory,
        ...data.memory
      };
    }

    const reply = String(data.reply || "").trim();

    if (!reply) {
      throw new Error(
        "API returned success but reply is empty"
      );
    }

    addMessage("assistant", reply);
    addHistory("assistant", reply);
    speakText(reply);
    updateMemoryBox();

  } catch (error) {

    console.error("KIKT /api/chat ERROR:", error);

    // TEMPORARY DEBUG MESSAGE: this exposes the real backend error.
    const errorMessage =
      "AI ERROR: " +
      (error?.message || "Unknown error");

    addMessage("assistant", errorMessage);
    addHistory("assistant", errorMessage);

  } finally {

    typing.style.display = "none";
    sendBtn.disabled = false;
    micSendBtn.disabled = false;
  }
}



async function startAI() {

  state.running = true;

  // IMPORTANT: Start AI must NOT turn the browser microphone on.
  // User must click "Mic: OFF" -> "Mic: ON" manually.
  state.mic = false;
  state.listening = false;

  micBtn.textContent = "Mic: OFF";
  micBtn.classList.remove("active");
  micSendBtn.classList.remove("active");

  updateStatus();


  if (state.history.length === 0) {

    const greeting =
      "Vanakkam sir! KIKT Software Solutions-la irundhu pesuren. Unga business-la enna process automate panna venum illa enna problem-ku software venum-nu sollunga.";

    addMessage(
      "assistant",
      greeting
    );

    addHistory(
      "assistant",
      greeting
    );

    speakText(
      greeting
    );

  }

}


function stopAI() {

  state.running = false;

  stopRecognition();

  updateStatus();

}


function setupRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    alert(
      "Voice recognition support illa. Chrome browser use pannunga."
    );

    return null;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-IN";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    3;


  recognition.onstart =
    () => {

      state.listening =
        true;

      micBtn.textContent =
        "Mic: ON";

      micBtn.classList.add(
        "active"
      );

      micSendBtn.classList.add(
        "active"
      );

    };


  recognition.onend =
    () => {

      state.listening =
        false;

      micSendBtn.classList.remove(
        "active"
      );

      if (!state.mic) {

        micBtn.textContent =
          "Mic: OFF";

        micBtn.classList.remove(
          "active"
        );

      }

    };


  recognition.onerror =
    event => {

      console.error(
        "Speech recognition:",
        event.error
      );

      state.listening =
        false;

      micSendBtn.classList.remove(
        "active"
      );

    };


  recognition.onresult =
    event => {

      const result =
        event.results[
          event.results.length - 1
        ][0].transcript;

      input.value =
        result;

      if (
        state.running &&
        result.trim()
      ) {

        sendMessage(
          result
        );

      }

    };


  return recognition;

}


function startRecognition() {

  if (!state.running)
    return;


  if (!state.recognition) {

    state.recognition =
      setupRecognition();

  }


  if (
    !state.recognition ||
    state.listening
  )
    return;


  try {

    state.recognition.start();

  } catch (error) {

    console.error(error);

  }

}


function stopRecognition() {

  if (
    state.recognition &&
    state.listening
  ) {

    try {

      state.recognition.stop();

    } catch (error) {}

  }

  state.listening =
    false;

}


startBtn.addEventListener(
  "click",
  startAI
);


stopBtn.addEventListener(
  "click",
  stopAI
);


speakBtn.addEventListener(
  "click",
  () => {

    state.speaking =
      !state.speaking;

    speakBtn.textContent =
      "Speak AI: " +
      (
        state.speaking
          ? "ON"
          : "OFF"
      );

    speakBtn.classList.toggle(
      "active",
      state.speaking
    );

  }
);


micBtn.addEventListener(
  "click",
  () => {

    state.mic =
      !state.mic;

    micBtn.textContent =
      "Mic: " +
      (
        state.mic
          ? "ON"
          : "OFF"
      );

    micBtn.classList.toggle(
      "active",
      state.mic
    );


    if (state.mic) {

      startRecognition();

    } else {

      stopRecognition();

    }

  }
);


micSendBtn.addEventListener(
  "click",
  () => {

    if (!state.running) {

      alert(
        "First Start AI click pannunga."
      );

      return;

    }


    if (!state.recognition) {

      state.recognition =
        setupRecognition();

    }


    if (state.listening) {

      stopRecognition();

    } else {

      startRecognition();

    }

  }
);


sendBtn.addEventListener(
  "click",
  () => {

    sendMessage(
      input.value
    );

  }
);


input.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      event.preventDefault();

      sendMessage(
        input.value
      );

    }

  }
);


clearBtn.addEventListener(
  "click",
  () => {

    stopRecognition();

    state.history = [];

    state.memory = {

      industry: "",

      requirements: [],

      problems: [],

      users: "",

      platform: "",

      currentSystem: "",

      contact: "",

      email: "",

      leadClosed: false

    };

    messages.innerHTML = "";

    updateMemoryBox();

    if (state.running) {

      startAI();

    }

  }
);


speakBtn.classList.add(
  "active"
);

updateStatus();

</script>

</body>
</html>
