<head>

<body>


<div class="container">

<h1>🤖 KIKT AI Voice Assistant</h1>

<div class="subtitle">
AI Sales & Software Support Assistant
</div>

<div id="status" class="status">
Ready
</div>

<div id="chat" class="chat"></div>

<div class="controls">

<button class="start"
        onclick="startAI()">
Start AI
</button>

<button class="speak"
        onclick="startListening()">
🎤 Speak to AI
</button>

<button class="stop"
        onclick="stopSpeaking()">
⛔ Stop Voice
</button>

</div>

<div class="input-area">

<input
id="userInput"
type="text"
placeholder="Type your message..."
onkeydown="handleEnter(event)"
>

<button
class="send"
onclick="sendMessage()">
Send
</button>

</div>

<div class="small">
KIKT Software Solutions
</div>

</div>



<script>

/* =====================================================
   CUSTOMER MEMORY
===================================================== */

const customer = {

    modules: [],

    problems: [],

    industry: "",

    features: [],

    users: "",

    employees: "",

    platform: "",

    currentSystem: "",

    existingSoftware: "",

    companyName: "",

    budget: "",

    contact: "",

    lastQuestion: "",

    started: false,

    priceAsked: false

};


/* =====================================================
   CONVERSATION
===================================================== */

let conversation = [];

let recognition = null;

let currentAudio = null;


/* =====================================================
   BASIC
===================================================== */

function normalize(text) {

    return text
        .toLowerCase()
        .replace(/[.,!?;:()]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

}


function addUnique(array, value) {

    if (!array.includes(value)) {

        array.push(value);

    }

}


function addMessage(sender, text) {

    const chat =
        document.getElementById("chat");

    const div =
        document.createElement("div");

    div.className =
        "message " +
        (sender === "AI" ? "ai" : "user");

    div.innerText = text;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;

}


function addConversation(role, text) {

    conversation.push({
        role: role,
        text: text
    });

}


function setStatus(text) {

    document.getElementById("status").innerText =
        text;

}


/* =====================================================
   ELEVENLABS
===================================================== */

async function speak(text) {

    try {

        stopSpeaking();

        setStatus("AI speaking...");

        const response =
            await fetch("/api/tts", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    text: text
                })

            });


        if (!response.ok) {

            throw new Error(
                "TTS failed"
            );

        }


        const blob =
            await response.blob();

        const url =
            URL.createObjectURL(blob);

        currentAudio =
            new Audio(url);

        currentAudio.onended =
            function() {

                setStatus(
                    "Ready"
                );

            };


        await currentAudio.play();

    }

    catch(error) {

        console.error(error);

        setStatus(
            "Voice unavailable"
        );

    }

}


function stopSpeaking() {

    if (currentAudio) {

        currentAudio.pause();

        currentAudio.currentTime = 0;

        currentAudio = null;

    }

}


/* =====================================================
   START
===================================================== */

function startAI() {

    if (customer.started) {

        const text =
            "Sure sir 👍 நம்ம previous discussion-ல இருந்து continue பண்ணலாம். என்ன doubt அல்லது requirement இருந்தாலும் கேளுங்க.";

        addMessage(
            "AI",
            text
        );

        speak(text);

        return;

    }


    customer.started = true;

    const greeting =
        "வணக்கம் sir! KIKT Software Solutions-ல இருந்து பேசுறேன். " +
        "உங்க business-க்கு என்ன மாதிரி software தேவைப்படுது? " +
        "நீங்க இப்போ face பண்ணுற problem என்னனாலும் சொல்லுங்க. " +
        "அதை based on software solution இருக்கா என்று நான் சொல்லுறேன்.";

    addMessage(
        "AI",
        greeting
    );

    addConversation(
        "assistant",
        greeting
    );

    customer.lastQuestion =
        "problem";

    speak(greeting);

}


/* =====================================================
   INPUT
===================================================== */

function handleEnter(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

}


function sendMessage() {

    const input =
        document.getElementById(
            "userInput"
        );

    const text =
        input.value.trim();

    if (!text) return;

    addMessage(
        "USER",
        text
    );

    addConversation(
        "user",
        text
    );

    input.value = "";

    processMessage(text);

}


/* =====================================================
   SPEECH
===================================================== */

function startListening() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "Speech recognition is not supported in this browser."
        );

        return;

    }


    recognition =
        new SpeechRecognition();

    recognition.lang =
        "ta-IN";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    setStatus(
        "Listening..."
    );

    recognition.start();


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                    .transcript;

            document.getElementById(
                "userInput"
            ).value = text;

            addMessage(
                "USER",
                text
            );

            addConversation(
                "user",
                text
            );

            processMessage(text);

        };


    recognition.onerror =
        function(error) {

            console.error(error);

            setStatus(
                "Speech recognition error"
            );

        };

}

            t.includes("manage") ||

        t.includes("follow up") ||

    /* MANUAL WORK */

    if (

        t.includes("excel") ||
        t.includes("paper") ||
        t.includes("book")
    ) {

        result.push(

    if (
        t.includes("data entry") ||
        t.includes("repeated entry")
    ) {

        result.push(
            "Data Entry Automation"
        );

    }


    return result;

}

/* =====================================================
   USER COUNT
===================================================== */

function detectUsers(text) {

    const t =
        normalize(text);


    const match =
        t.match(
            /(\d+)\s*(users?|people|staff|employees?|members?|peru|பேர்|பேரு)/
        );


    if (match) {

        return match[1];

    }


    if (
        customer.lastQuestion ===
        "users"
    ) {

        const onlyNumber =
            t.match(/^(\d+)$/);

        if (onlyNumber) {

            return onlyNumber[1];

        }

    }


    return "";

}


/* =====================================================
   PLATFORM
===================================================== */

function detectPlatform(text) {

    const t =
        normalize(text);


    if (
        t.includes("rendum") ||
        t.includes("both") ||
        (
            t.includes("mobile") &&
            (
                t.includes("computer") ||
                t.includes("desktop") ||
                t.includes("laptop")
            )
        )
    ) {

        return "Computer + Mobile";

    }


    if (
        t.includes("mobile") ||
        t.includes("android")
    ) {

        return "Mobile";

    }


    if (
        t.includes("computer") ||
        t.includes("desktop") ||
        t.includes("laptop")
    ) {

        return "Computer / Web";

    }


    return "";

}

        );


        return (
            "ஆம் sir, attendance management software மூலம் employee check-in, check-out, working hours, late entry and absent details track பண்ணலாம். " +
            "தேவைப்பட்டா இதை payroll / salary calculation-உடனும் connect பண்ணலாம்."
        );

    }


    /* CUSTOMER FOLLOW UP */

    if (
        problems.includes(
            "Customer Follow-up Management"
        )
    ) {

        addUnique(
            customer.modules,
            "CRM"
        );


        return (
            "ஆம் sir, அதுக்கு CRM solution use பண்ணலாம். " +
            "Customer details, enquiry, follow-up date, sales status and customer history track பண்ண முடியும். " +
            "Follow-up miss ஆகாமல் reminders-um configure பண்ணலாம்."
        );

    }


    /* MANUAL */

    if (
        problems.includes(
            "Manual Data Management"
        )
    ) {

        return (
            "ஆம் sir, manual / Excel work-ஐ software மூலம் centralize பண்ணி manage பண்ணலாம். " +
            "Data entry reduce பண்ணி reports and tracking easier ஆக்கலாம்."
        );

    }


    return "";

}


/* =====================================================
   SUGGEST FEATURES
===================================================== */

function suggestedFeatures() {

    const result = [];


    if (
        customer.modules.includes(
            "Billing"
        )
    ) {

        result.push(
            "GST",
            "Sales",
            "Purchase",
            "Customer Management",
            "Barcode",
            "Reports"
        );

    }


    if (
        customer.modules.includes(
            "Inventory"
        )
    ) {

        result.push(
            "Stock Tracking",
            "Material Issue",
            "Material Consumption",
            "Wastage Tracking",
            "Supplier Management",
            "Reports"
        );

    }


    if (
        customer.modules.includes(
            "Manufacturing / Production"
        ) ||
        customer.industry ===
        "Manufacturing"
    ) {

        result.push(
            "Production Management",
            "Raw Material Tracking",
            "Material Consumption",
            "Wastage Tracking"
        );

    }


    if (
        customer.modules.includes(
            "CRM"
        )
    ) {

        result.push(
            "Customer Management",
            "Follow-up",
            "Reminder",
            "Reports"
        );

    }


    if (
        customer.modules.includes(
            "HR"
        )
    ) {

        result.push(
            "Attendance",
            "Employee Management",
            "Salary",
            "Reports"
        );

    }


    return [
        ...new Set(result)
    ];

}


/* =====================================================
   UPDATE MEMORY
===================================================== */

function updateMemory(text) {


    /* MODULES */

    detectModules(text)
        .forEach(
            item => {

                addUnique(
                    customer.modules,
                    item
                );

            }
        );


    /* PROBLEMS */

    detectProblems(text)
        .forEach(
            item => {

                addUnique(
                    customer.problems,
                    item
                );

            }
        );


    /* INDUSTRY */

    const industry =
        detectIndustry(text);


    if (industry) {

        customer.industry =
            industry;

    }


    /* FEATURES */

    detectFeatures(text)
        .forEach(
            item => {

                addUnique(
                    customer.features,
                    item
                );

            }
        );


    /* USERS */

    const users =
        detectUsers(text);


    if (users) {

        customer.users =
            users;

    }


    /* PLATFORM */

    const platform =
        detectPlatform(text);


    if (platform) {

        customer.platform =
            platform;

    }


    /* CURRENT SYSTEM */

    const system =
        detectCurrentSystem(text);


    if (system) {

        customer.currentSystem =
            system;

    }


    /* PHONE */

    const phone =
        text.match(
            /(?:\+91[\s-]?)?[6-9]\d{9}/
        );


    if (phone) {

        customer.contact =
            phone[0];

    }


    /* EMAIL */

    const email =
        text.match(
            /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i
        );


    if (email) {

        customer.contact =
            email[0];

    }

}


/* =====================================================
   PRICE
===================================================== */

function isPriceQuestion(text) {

    const t =
        normalize(text);


    return (
        t.includes("price") ||
        t.includes("cost") ||
        t.includes("rate") ||
        t.includes("how much") ||
        t.includes("evalo") ||
        t.includes("evlo") ||
        t.includes("amount") ||
        t.includes("quotation") ||
        t.includes("quote") ||
        t.includes("pricing") ||
        t.includes("charge")
    );

}


/* =====================================================
   SUMMARY
===================================================== */

function getSummary() {

    const summary = [];


    if (
        customer.industry
    ) {

        summary.push(
            "Industry: " +
            customer.industry
        );

    }


    if (
        customer.modules.length
    ) {

        summary.push(
            "Modules: " +
            customer.modules.join(
                ", "
            )
        );

    }


    if (
        customer.problems.length
    ) {

        summary.push(
            "Problems: " +
            customer.problems.join(
                ", "
            )
        );

    }


    if (
        customer.features.length
    ) {

        summary.push(
            "Features: " +
            customer.features.join(
                ", "
            )
        );

    }


    if (
        customer.users
    ) {

        summary.push(
            "Users: " +
            customer.users
        );

    }


    if (
        customer.platform
    ) {

        summary.push(
            "Platform: " +
            customer.platform
        );

    }


    if (
        customer.currentSystem
    ) {

        summary.push(
            "Current system: " +
            customer.currentSystem
        );

    }


    return summary.join(
        "\n"
    );

}


/* =====================================================
   NEXT SALES STEP
===================================================== */

function nextSalesStep() {


    /* INDUSTRY */

    if (
        !customer.industry &&
        customer.modules.length > 0
    ) {

        customer.lastQuestion =
            "industry";

        return (
            "Okay sir 👍 unga requirement note panniten. " +
            "Unga business / industry enna sir?"
        );

    }


    /* FEATURES */

    if (
        customer.features.length === 0 &&
        customer.modules.length > 0
    ) {

        const suggestions =
            suggestedFeatures();


        customer.lastQuestion =
            "features";


        if (
            suggestions.length > 0
        ) {

            return (
                "Unga requirement-ku " +
                suggestions
                    .slice(0,7)
                    .join(", ") +
                " போன்ற features useful-ah இருக்கும் sir. " +
                "இதுல உங்களுக்கு என்னென்ன தேவை?"
            );

        }

    }


    /* USERS */

    if (
        !customer.users
    ) {

        customer.lastQuestion =
            "users";

        return (
            "Okay sir 👍 approximately evlo users software use panna poranga?"
        );

    }


    /* PLATFORM */

    if (
        !customer.platform
    ) {

        customer.lastQuestion =
            "platform";

        return (
            "Okay sir 👍 software computer-la use panna poringala, mobile-la use panna poringala, illa rendu platform-um venuma?"
        );

    }


    /* CURRENT SYSTEM */

    if (
        !customer.currentSystem
    ) {

        customer.lastQuestion =
            "currentSystem";

        return (
            "Perfect sir 👍 ippo indha process manual / Excel-la manage panreengala, illa already existing software use panreengala?"
        );

    }


    /* COMPLETE */

    customer.lastQuestion =
        "complete";


    return (
        "Super sir 👍 unga requirement clear-ah understand panniten. " +
        "Ippo basic requirement summary:\n\n" +
        getSummary() +
        "\n\n" +
        "Indha requirement based on KIKT team quotation / demo discussion continue pannalaam sir. " +
        "WhatsApp or contact number share pannunga."
    );

}


/* =====================================================
   MAIN AI ENGINE
===================================================== */

function processMessage(text) {


    const t =
        normalize(text);


    /* ---------------------------------------------
       STEP 1
       ALWAYS UPDATE MEMORY FIRST
    --------------------------------------------- */

    updateMemory(text);


    /* ---------------------------------------------
       STEP 2
       CUSTOMER ASKS A GENERAL QUESTION
       ANSWER FIRST
    --------------------------------------------- */

    const generalQuestion =
        detectGeneralQuestion(text);


    if (
        generalQuestion
    ) {

        const answer =
            answerGeneralQuestion(
                generalQuestion
            );


        addMessage(
            "AI",
            answer
        );

        addConversation(
            "assistant",
            answer
        );

        speak(answer);


        /*
         * After answering the question,
         * continue sales conversation.
         */

        setTimeout(
            function() {

                const next =
                    nextSalesStep();

                addMessage(
                    "AI",
                    next
                );

                addConversation(
                    "assistant",
                    next
                );

                speak(next);

            },
            1800
        );


        return;

    }


    /* ---------------------------------------------
       STEP 3
       CUSTOMER ASKS ABOUT PRICE
    --------------------------------------------- */

    if (
        isPriceQuestion(text)
    ) {

        customer.priceAsked =
            true;


        const answer =
            customer.modules.length > 0

            ?

            (
                "Sure sir 👍 software cost exact-ah சொல்லணும்னா required modules, " +
                "features, users and platform scope consider பண்ணணும். " +
                "Ippo நம்ம discussion-la note பண்ணிருப்பது:\n\n" +
                getSummary() +
                "\n\n" +
                "இந்த scope based on KIKT team quotation prepare பண்ணலாம் sir. " +
                "Exact requirement confirm பண்ணிட்டு quotation share பண்ணுவோம்."
            )

            :

            (
                "Sure sir 👍 software cost requirement and scope based on vary aagum. " +
                "Unga business problem and required software solution first understand pannittu quotation prepare pannalaam."
            );


        addMessage(
            "AI",
            answer
        );

        addConversation(
            "assistant",
            answer
        );

        speak(answer);


        /*
         * Do NOT restart the sales flow.
         * Ask only if something important is missing.
         */

        setTimeout(
            function() {

                if (
                    !customer.users
                ) {

                    const next =
                        "Approximately evlo users software use panna poranga sir?";

                    customer.lastQuestion =
                        "users";

                    addMessage(
                        "AI",
                        next
                    );

                    speak(next);

                }

                else if (
                    !customer.platform
                ) {

                    const next =
                        "Software computer-la use panna poringala, mobile-la use panna poringala, illa rendu platform-um venuma sir?";

                    customer.lastQuestion =
                        "platform";

                    addMessage(
                        "AI",
                        next
                    );

                    speak(next);

                }

            },
            1800
        );


        return;

    }


    /* ---------------------------------------------
       STEP 4
       PROBLEM ANALYSIS
    --------------------------------------------- */

    const problemAnswer =
        answerProblem(text);


    if (
        problemAnswer
    ) {

        addMessage(
            "AI",
            problemAnswer
        );

        addConversation(
            "assistant",
            problemAnswer
        );

        speak(problemAnswer);


        /*
         * Continue sales flow after
         * understanding the problem.
         */

        setTimeout(
            function() {

                const next =
                    nextSalesStep();

                addMessage(
                    "AI",
                    next
                );

                addConversation(
                    "assistant",
                    next
                );

                speak(next);

            },
            2200
        );


        return;

    }


    /* ---------------------------------------------
       STEP 5
       NORMAL SALES FLOW
    --------------------------------------------- */

    const reply =
        nextSalesStep();


    addMessage(
        "AI",
        reply
    );

    addConversation(
        "assistant",
        reply
    );

    speak(reply);

}
