/* =========================================================

========================================================= */

const state = {

/* =========================================================
   AUDIO
========================================================= */

let currentAudio = null;


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

let recognition = null;

let speechSupported = false;

let speechFinalText = "";

let speechRestart = false;


/* =========================================================
   CREATE SPEECH RECOGNITION
========================================================= */

if(
    "SpeechRecognition" in window ||
    "webkitSpeechRecognition" in window
){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    recognition =
        new SpeechRecognition();

    speechSupported = true;

    recognition.continuous = true;

    recognition.interimResults = true;

    /*
       en-IN works better for
       Tanglish + English business words.

       User can still speak Tamil;
       our parser handles many Tamil/Tanglish
       words after transcription.
    */

    recognition.lang = "en-IN";


    recognition.onstart = function(){

        statusEl.textContent =
            "🎙 Listening...";

        micBtn.textContent =
            "🎙 Microphone ON";

        micBtn.classList.add("active");

    };


    recognition.onresult = function(event){

        let finalText = "";

        let interimText = "";


        for(
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ){

            const transcript =
                event.results[i][0].transcript;

            if(event.results[i].isFinal){

                finalText +=
                    transcript + " ";

            }
            else{

                interimText +=
                    transcript;

            }

        }


        /*
           Show live transcript
        */

        if(interimText){

            inputEl.value =
                interimText;

            typingEl.textContent =
                "Listening: " +
                interimText;

        }


        /*
           Final speech
        */

        if(finalText.trim()){

            speechFinalText =
                finalText.trim();

            inputEl.value =
                speechFinalText;

            typingEl.textContent =
                "Voice captured";


            /*
               Automatically send
            */

            setTimeout(
                function(){

                    if(
                        speechFinalText.trim()
                    ){

                        const text =
                            speechFinalText.trim();

                        speechFinalText = "";

                        sendText(text);

                    }

                },
                350
            );

        }

    };


    recognition.onerror = function(event){

        console.log(
            "Speech error:",
            event.error
        );


        if(event.error === "not-allowed"){

            state.microphoneEnabled =
                false;

            micBtn.textContent =
                "🎙 Microphone OFF";

            micBtn.classList.remove(
                "active"
            );

            statusEl.textContent =
                "Microphone permission denied";

        }

    };


    recognition.onend = function(){

        /*
           If user didn't switch mic OFF,
           restart listening.
        */

        if(
            state.microphoneEnabled &&
            state.started
        ){

            try{

                recognition.start();

            }
            catch(e){}

        }
        else{

            micBtn.textContent =
                "🎙 Microphone OFF";

            micBtn.classList.remove(
                "active"
            );

        }

    };

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(text){

    return text

        .toLowerCase()

        .replace(/[.,!?;:()[\]{}]/g," ")

        .replace(/\s+/g," ")

        .trim();

}


/* =========================================================
   MESSAGE
========================================================= */

function addMessage(text,type){

    const row =
        document.createElement("div");

    row.className =
        "msg " + type;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    row.appendChild(
        bubble
    );


    messagesEl.appendChild(
        row
    );


    messagesEl.scrollTop =
        messagesEl.scrollHeight;

}


/* =========================================================
   USER
========================================================= */

function userSay(text){

    addMessage(
        text,
        "user"
    );

}


/* =========================================================
   AI
========================================================= */

function aiSay(text){

    addMessage(
        text,
        "ai"
    );


    if(
        state.speakEnabled &&
        state.started
    ){

        speak(text);

    }

}


/* =========================================================
   ELEVENLABS
========================================================= */

async function speak(text){

    try{

        stopAudio();

        statusEl.textContent =
            "🔊 AI Speaking...";


        const response =
            await fetch(
                "/api/tts",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        text:text
                    })

                }
            );


        if(!response.ok){

            statusEl.textContent =
                "AI Ready";

            return;

        }


        const blob =
            await response.blob();


        const url =
            URL.createObjectURL(
                blob
            );


        currentAudio =
            new Audio(url);


        currentAudio.onended =
            function(){

                URL.revokeObjectURL(
                    url
                );

                currentAudio =
                    null;

                statusEl.textContent =
                    "AI Ready";

            };


        await currentAudio.play();

    }
    catch(error){

        console.error(error);

        statusEl.textContent =
            "AI Ready";

    }

}


/* =========================================================
   STOP AUDIO
========================================================= */

function stopAudio(){

    if(currentAudio){

        currentAudio.pause();

        currentAudio.currentTime = 0;

        currentAudio = null;

    }

}


/* =========================================================
   HAS
========================================================= */

function has(text,words){

    return words.some(
        word => text.includes(word)
    );

}


/* =========================================================
   UNIQUE
========================================================= */

function addUnique(array,value){

    if(
        value &&
        !array.includes(value)
    ){

        array.push(value);

    }

}

/* =========================================================
   DETECT REQUIREMENTS
========================================================= */

function detectRequirements(text){

    for(
        const rule of requirementRules
    ){

        if(
            has(
                text,
                rule.words
            )
        ){

            addUnique(
                state.requirements,
                rule.label
            );

        }

    }

}


/* =========================================================
   PROBLEMS
========================================================= */

function detectProblems(text){

    if(
        has(
            text,
            [
                "manual",
                "paper",
                "excel",
                "excel sheet",
                "not using software"
            ]
        )
    ){

        addUnique(
            state.problems,
            "Manual / Excel based process"
        );

    }


    if(
        has(
            text,
            [
                "wastage",
                "waste",
                "material wastage",
                "consumption problem"
            ]
        )
    ){

        addUnique(
            state.problems,
            "Material wastage / consumption tracking"
        );

    }


    if(
        has(
            text,
            [
                "missing",
                "stock missing",
                "material missing"
            ]
        )
    ){

        addUnique(
            state.problems,
            "Material / stock missing"
        );

    }

}


/* =========================================================
   USERS
========================================================= */

function detectUsers(text){

    /*
       10 users
       10 staff
       10 employees
       10 people
       10 பேர் -> if transcript captures number only
    */

    const match =
        text.match(
            /(\d+)\s*(users?|staff|employees?|people|members?|persons?)/i
        );


    if(match){

        state.users =
            match[1];

        return true;

    }


    /*
       If AI specifically asked users,
       bare number is accepted.
    */

    if(
        state.lastQuestionType === "users" &&
        /^\d+$/.test(text)
    ){

        state.users =
            text;

        return true;

    }


    return false;

}

       both
       both platform
       mobile and computer
       mobile computer
       mobile + web
    */

    if(
        has(
            text,
            [
                "rendu platform",
                "rendu platform um",
                "rendu platform venum",
                "rendu",
                "both",
                "both platform",
                "both platforms",
                "two platform",
                "two platforms",
                "mobile and computer",
                "mobile and desktop",
                "mobile computer",
                "mobile web",
                "mobile plus computer",
                "mobile + computer"
            ]
        )
    ){

        /*
           Only treat "rendu" as platform
           when previous question was platform
           OR message contains platform context.
        */

        if(
            state.lastQuestionType === "platform" ||
            has(
                text,
                [
                    "platform",
                    "mobile",
                    "computer",
                    "desktop",
                    "web"
                ]
            )
        ){

            state.platform =
                "Mobile + Computer";

            return true;

        }

    }


    if(
        has(
            text,
            [
                "mobile",
                "android",
                "smartphone",
                "phone app",
                "mobile app"
            ]
        )
    ){

        state.platform =
            "Mobile";

        return true;

    }


    if(
        has(
            text,
            [
                "computer",
                "desktop",
                "laptop",
                "web application",
                "web app",
                "browser"
            ]
        )
    ){

        state.platform =
            "Computer / Web";

        return true;

    }


    return false;

}

/* =========================================================
   CONTACT
========================================================= */

function detectContact(text){

    const phone =
        text.match(
            /(?:\+91[\s-]?)?[6-9]\d{9}/
        );


    if(phone){

        state.contact =
            phone[0];

        return true;

    }


    const email =
        text.match(
            /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i
        );


    if(email){

        state.email =
            email[0];

        return true;

    }


    return false;

}

/* =========================================================
   PROCESS MESSAGE
========================================================= */

async function processMessage(rawText){

    const text =
        normalize(rawText);


    if(!text)
        return;


    /*
       =====================================================
       FIRST: Extract information
       =====================================================
    */

    const oldIndustry =
        state.industry;


    detectIndustry(text);


    /*
       If industry changed,
       old requirement was already cleared
       inside detectIndustry().
    */


    detectRequirements(text);

    detectProblems(text);

    detectUsers(text);

    detectPlatform(text);

    detectCurrentSystem(text);

    detectContact(text);


    /*
       =====================================================
       CONTACT
       =====================================================
    */

    if(
        state.contact &&
        state.requirements.length > 0 &&
        !state.leadClosed
    ){

        aiSay(
            closeLead()
        );

        return;

    }


    /*
       =====================================================
       PRICE
       =====================================================
    */

    if(
        isPriceQuestion(text)
    ){

        aiSay(
            priceAnswer()
        );

        return;

    }


    /*
       =====================================================
       FAQ
       =====================================================
    */

    const faq =
        answerFAQ(text);


    if(faq){

        aiSay(faq);


        /*
           Answer question first.
           Then continue from current context.
        */

        if(
            !state.leadClosed
        ){

            const next =
                nextQuestion();


            if(next){

                setTimeout(
                    ()=>{
                        aiSay(next);
                    },
                    650
                );

            }

        }

        return;

    }


    /*
       =====================================================
       IF USER ANSWERED CURRENT QUESTION
       =====================================================
    */


    /*
       USERS ANSWER

       Example:
       AI: How many users?
       User: 10

       Do NOT repeat requirement summary.
    */

    if(
        state.lastQuestionType === "users" &&
        state.users
    ){

        const next =
            nextQuestion();


        aiSay(
            "Okay sir 👍 " +
            state.users +
            " users-nu note panniten." +
            (
                next
                ? "\n\n" + next
                : ""
            )
        );

        return;

    }


    /*
       PLATFORM ANSWER

       Example:
       AI: Mobile / computer / both?
       User: rendu platform um venum
    */

    if(
        state.lastQuestionType === "platform" &&
        state.platform
    ){

        const next =
            nextQuestion();


        aiSay(
            "Perfect sir 👍 " +
            state.platform +
            " platform-nu note panniten." +
            (
                next
                ? "\n\n" + next
                : ""
            )
        );

        return;

    }


    /*
       CURRENT SYSTEM ANSWER
    */

    if(
        state.lastQuestionType === "currentSystem" &&
        state.currentSystem
    ){

        const next =
            nextQuestion();


        aiSay(
            "Okay sir 👍 current system " +
            state.currentSystem +
            " nu note panniten." +
            (
                next
                ? "\n\n" + next
                : ""
            )
        );

        return;

    }


    /*
       =====================================================
       INDUSTRY ONLY
       =====================================================
    */

    if(
        state.industry &&
        state.requirements.length === 0
    ){

        /*
           If customer changed:
           salon -> hospital
        */

        const list =
            industrySuggestions();


        state.lastQuestionType =
            "requirements";


        aiSay(
            "Okay sir 👍 " +
            state.industry +
            " software requirement-nu note panniten. " +
            list.slice(0,4).join(", ") +
            " madhiri modules available. " +
            "Ungalukku mainly edhu venum sir?"
        );


        return;

    }


    /*
       =====================================================
       REQUIREMENTS FOUND
       =====================================================
    */

    if(
        state.requirements.length > 0
    ){

        let response =
            "Yes sir 👍 ";


        if(state.industry){

            response +=
                state.industry +
                " business requirement-nu note panniten. ";

        }


        response +=
            "Neenga sonna " +
            state.requirements.join(", ") +
            " software-la manage panna mudiyum.";


        if(
            state.problems.length
        ){

            response +=
                "\n" +
                state.problems.join(", ") +
                " problem-um software workflow-la handle panna mudiyum.";

        }


        const next =
            nextQuestion();


        if(next){

            response +=
                "\n\n" +
                next;

        }


        aiSay(
            response
        );


        return;

    }


    /*
       =====================================================
       DEFAULT
       =====================================================
    */

    aiSay(
        nextQuestion()
    );

}


/* =========================================================
   SEND TEXT
========================================================= */

async function sendText(text){

    if(!text)
        return;


    userSay(text);


    inputEl.value =
        "";


    sendBtn.disabled =
        true;


    typingEl.textContent =
        "AI is thinking...";


    try{

        await processMessage(
            text
        );

    }
    catch(error){

        console.error(error);

        aiSay(
            "Sorry sir, konjam technical issue. Requirement-a once more simple-ah sollunga."
        );

    }


    typingEl.textContent =
        "";


    sendBtn.disabled =
        false;


    inputEl.focus();

}


/* =========================================================
   SEND BUTTON
========================================================= */

sendBtn.addEventListener(
    "click",
    function(){

        const text =
            inputEl.value.trim();

        if(text){

            sendText(text);

        }

    }
);


/* =========================================================

========================================================= */

inputEl.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            const text =

            if(text){

                sendText(text);

            }

        }

    }
);

            );


            statusEl.textContent =

        }

    }

/* =========================================================
   MICROPHONE
========================================================= */

micBtn.addEventListener(
    "click",
    function(){

        if(!speechSupported){

            alert(
                "Your browser does not support microphone speech recognition. Please use Google Chrome."
            );

            return;

        }


        if(!state.started){

            alert(
                "First click Start AI."
            );

            return;

        }


        /*
           TURN OFF
        */

        if(
            state.microphoneEnabled
        ){

            state.microphoneEnabled =
                false;


            try{

                recognition.stop();

            }
            catch(e){}


            micBtn.textContent =
                "🎙 Microphone OFF";

            micBtn.classList.remove(
                "active"
            );


            statusEl.textContent =
                "AI Ready";


            return;

        }


        /*
           TURN ON
        */

        state.microphoneEnabled =
            true;


        try{

            recognition.start();

        }
        catch(error){

            console.log(error);

        }

    }
);


/* =========================================================
   INITIAL
========================================================= */

statusEl.textContent =
    "AI Ready";
